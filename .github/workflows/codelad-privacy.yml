name: Codelad privacy policy

on:
  push:
    branches: [dev, stable]
  pull_request:
    branches: [dev, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codelad-privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Source privacy policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Codelad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check product and dependency policy
        run: node build/codelad/check-privacy.ts
      - name: Test source policy and capture parsers
        run: node --test build/codelad/privacy.test.ts build/codelad/networkAudit.test.ts build/codelad/linuxConnections.test.ts
